name: Keep API Warm

# Pings the Render API /health endpoint every 13 minutes to prevent the free-tier
# container from sleeping (Render suspends after ~15 min idle, cold-start ~50s).
# 13 minutes leaves a 2-minute safety margin.

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping API health endpoint
        run: |
          URL="https://attendease-api-4h45.onrender.com/health"
          echo "Pinging $URL"
          # Retry up to 3 times — Render free-tier cold starts can take 60-120s.
          for ATTEMPT in 1 2 3; do
            echo "Attempt $ATTEMPT/3"
            HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "HTTP $HTTP_CODE"
            cat /tmp/body.txt 2>/dev/null || true
            echo
            case "$HTTP_CODE" in
              2*) echo "✓ API is warm"; exit 0 ;;
            esac
            [ "$ATTEMPT" -lt 3 ] && echo "Retrying in 30s..." && sleep 30
          done
          # Don't fail the workflow — this is just a keep-warm ping, not a test.
          echo "⚠ API did not respond after 3 attempts (may be deploying or scaled down)"
          exit 0
